<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bunny’s Birthday</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f1115;
      color: #F9F5F0;
    }


    .card {
      width: min(680px, calc(100% - 40px));
      text-align: center;
      padding: 42px 32px;
    }

    .eyebrow {
      margin: 0 0 12px;
      font-size: 13px;
      letter-spacing: .14em;
      text-transform: uppercase;
      opacity: .95;
      color: #E88294;
    }

    h1 {
      margin: 0 0 28px;
      font-size: clamp(32px, 7vw, 64px);
      line-height: 1;
      font-weight: 750;
    }

    .progress-wrapper {
      position: relative;
      height: 28px;
      overflow: hidden;
      border-radius: 999px;
      background: #F9F5F0;
      box-shadow: inset 0 1px 3px rgba(216, 88, 88, 0.614);
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #E88294, #e8a5b1);
      transition: width 900ms cubic-bezier(.22, 1, .36, 1);
    }

    .progress-value {
      margin-top: 18px;
      font-size: clamp(42px, 10vw, 80px);
      line-height: 1;
      font-weight: 800;
    }

    .message {
      min-height: 24px;
      margin-top: 14px;
      font-size: 16px;
      opacity: .65;
    }

      .success-message {
      display: none;
      margin-top: 18px;
      font-size: 18px;
      line-height: 1.4;
    }

    .success-message strong {
      display: block;
      font-size: clamp(28px, 7vw, 48px);
      line-height: 1;
      margin-bottom: 10px;
      color: #E88294;
    }

    .success-message span {
      display: block;
      opacity: .9;
    }

    .updated {
      margin-top: 26px;
      font-size: 12px;
      opacity: .35;
    }

    .error {
      color: #ff8d8d;
      opacity: 1;
    }
  </style>
</head>

<body>
  <main class="card">
    <img src="logo.jpg" width="50%" style="border-radius:  15px; margin-bottom: 30px;"></img>
    <p class="eyebrow">Paying off my debt, one burger at a time  </p>
    <h1>Loading...</h1>

    <div class="progress-wrapper" aria-label="Progress">
      <div id="progressBar" class="progress-bar"></div>
    </div>

    <div id="progressValue" class="progress-value">0%</div>
     <!-- Normal message from Google Sheets -->
    <div id="message" class="message">
      Checking latest status...
    </div>

    <!-- Message shown when progress reaches 100% -->
    <div id="successMessage" class="success-message">
      <strong>WE FUCKING DID IT! 🎉</strong>
      <span>Bunny’s Burgers is finally ours.</span>
    </div>

    <div id="updated" class="updated"></div>
  </main>

  <script>
    /*
     * ============================================================
     * CONFIGURATION
     * ============================================================
     *
     * Google Sheet:
     *   A1 = progress
     *   A2 = 73
     *   B1 = message
     *   B2 = Almost there!
     *
     * Publish the sheet to the web, then put its ID and GID below.
     */

    const CONFIG = {
      sheetId: "2PACX-1vRHy8RNXWfkbAW7DR7Ct7Q0jneK1uv8EoOfIVyKI5c4SGe7EYDahuOVRjli0Sz8BUzIOECmTtqDSKCZ",
      gid: "0",
      refreshMs: 15000
    };

    const progressBar = document.getElementById("progressBar");
    const progressValue = document.getElementById("progressValue");
    const message = document.getElementById("message");
    const updated = document.getElementById("updated");
    const successMessage = document.getElementById("successMessage");

    function sheetUrl() {
      return `https://docs.google.com/spreadsheets/d/e/${CONFIG.sheetId}/pub?gid=${CONFIG.gid}&single=true&output=csv&t=${Date.now()}`;
    }

    function parseCsvLine(line) {
      // Simple CSV parser supporting quoted cells.
      const result = [];
      let current = "";
      let quoted = false;

      for (let i = 0; i < line.length; i++) {
        const char = line[i];
        const next = line[i + 1];

        if (char === '"' && quoted && next === '"') {
          current += '"';
          i++;
        } else if (char === '"') {
          quoted = !quoted;
        } else if (char === "," && !quoted) {
          result.push(current.trim());
          current = "";
        } else {
          current += char;
        }
      }

      result.push(current.trim());
      return result;
    }

    async function loadProgress() {
      try {
        if (CONFIG.sheetId === "YOUR_GOOGLE_SHEET_ID") {
          throw new Error("Add your Google Sheet ID to CONFIG.sheetId.");
        }

        const response = await fetch(sheetUrl(), { cache: "no-store" });

        if (!response.ok) {
          throw new Error(`Google Sheets returned HTTP ${response.status}.`);
        }

        const csv = await response.text();
        const rows = csv
          .trim()
          .split(/\r?\n/)
          .map(parseCsvLine);

        // A2 = progress, B2 = optional message.
        const progress = Number(rows[1]?.[0]);
        const text = rows[1]?.[1] || "";

        if (!Number.isFinite(progress)) {
          throw new Error("Cell A2 must contain a number.");
        }

        const safeProgress = Math.max(0, Math.min(100, progress));

        progressBar.style.width = `${safeProgress}%`;
        progressValue.textContent = `${safeProgress}%`;
        //message.textContent = text || "Loading...";
        message.classList.remove("error");

        if (progress >= 100) {
          message.style.display = "none";
          successMessage.style.display = "block";
        } else {
          message.style.display = "block";
          successMessage.style.display = "none";
          message.textContent = text || "Loading...";
        }

        updated.textContent =
          `Last checked: ${new Date().toLocaleTimeString()}`;
      } catch (error) {
        console.error(error);
        message.textContent = error.message;
        message.classList.add("error");
      }
    }

    async function startPolling() {
      while (true) {
        await loadProgress();
        await new Promise(resolve => setTimeout(resolve, CONFIG.refreshMs));
      }
    }
    startPolling();
  </script>
</body>
</html>
